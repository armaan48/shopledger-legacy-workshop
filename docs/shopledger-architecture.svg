<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900">
  <style>
    .box{fill:#f8fafc;stroke:#334155;stroke-width:2;rx:12}.ui{fill:#e0f2fe}.route{fill:#fef3c7}.lib{fill:#dcfce7}.data{fill:#fee2e2}.title{font:700 22px sans-serif;fill:#0f172a}.label{font:600 16px sans-serif;fill:#0f172a}.small{font:14px sans-serif;fill:#334155}.arrow{stroke:#475569;stroke-width:3;fill:none;marker-end:url(#arrow)}.flow{stroke:#2563eb;stroke-width:4;fill:none;marker-end:url(#arrowBlue)}
  </style>
  <defs><marker id="arrow" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#475569"/></marker><marker id="arrowBlue" markerWidth="10" markerHeight="10" refX="9" refY="3" orient="auto"><path d="M0,0 L10,3 L0,6 z" fill="#2563eb"/></marker></defs>
  <text x="40" y="42" class="title">ShopLedger legacy architecture</text>
  <rect x="40" y="80" width="300" height="160" class="box ui"/><text x="60" y="115" class="label">Browser UI</text><text x="60" y="145" class="small">public/index.html</text><text x="60" y="170" class="small">public/js/app.js</text><text x="60" y="195" class="small">public/css/style.css</text>
  <rect x="420" y="80" width="300" height="160" class="box"/><text x="440" y="115" class="label">server.js</text><text x="440" y="145" class="small">Express app</text><text x="440" y="170" class="small">static files + JSON body parser</text><text x="440" y="195" class="small">invoice HTML route</text>
  <rect x="800" y="55" width="260" height="90" class="box route"/><text x="820" y="90" class="label">routes/products.js</text><text x="820" y="118" class="small">products, coupons</text>
  <rect x="1100" y="55" width="260" height="90" class="box route"/><text x="1120" y="90" class="label">routes/orders.js</text><text x="1120" y="118" class="small">orders, checkout, cancel</text>
  <rect x="800" y="175" width="260" height="90" class="box route"/><text x="820" y="210" class="label">routes/customers.js</text><text x="820" y="238" class="small">Khata accounts</text>
  <rect x="1100" y="175" width="260" height="90" class="box route"/><text x="1120" y="210" class="label">routes/reports.js</text><text x="1120" y="238" class="small">dashboard + audit</text>
  <rect x="40" y="350" width="240" height="280" class="box lib"/><text x="60" y="385" class="label">lib/pricing.js</text><text x="60" y="415" class="small">subtotal + totals</text><text x="60" y="470" class="label">lib/tax.js</text><text x="60" y="500" class="small">HSN slabs + split</text><text x="60" y="555" class="label">lib/coupons.js</text><text x="60" y="585" class="small">validation + discounts</text>
  <rect x="330" y="350" width="240" height="280" class="box lib"/><text x="350" y="385" class="label">lib/invoice.js</text><text x="350" y="415" class="small">invoice figures + HTML</text><text x="350" y="470" class="label">lib/orders.js</text><text x="350" y="500" class="small">add, list, cancel</text><text x="350" y="555" class="label">lib/inventory.js</text><text x="350" y="585" class="small">sellable stock + reserve</text>
  <rect x="620" y="350" width="240" height="280" class="box lib"/><text x="640" y="385" class="label">lib/ledger.js</text><text x="640" y="415" class="small">Khata billing + settlement</text><text x="640" y="470" class="label">lib/reports.js</text><text x="640" y="500" class="small">dashboard + reconciliation</text><text x="640" y="555" class="label">lib/store.js</text><text x="640" y="585" class="small">read, write, audit</text>
  <rect x="930" y="390" width="330" height="170" class="box"/><text x="950" y="430" class="label">config.js</text><text x="950" y="460" class="small">port, shop, tax, inventory, coupons</text><rect x="930" y="610" width="330" height="170" class="box data"/><text x="950" y="650" class="label">data/db.json</text><text x="950" y="680" class="small">products, orders, customers</text><text x="950" y="710" class="small">settlements, audit log</text>
  <path d="M340 160 H420" class="arrow"/><path d="M720 130 H800" class="arrow"/><path d="M720 170 H1100" class="arrow"/><path d="M950 145 V175" class="arrow"/><path d="M1230 145 V175" class="arrow"/><path d="M800 220 H570 V350" class="arrow"/>
  <path d="M280 470 H330" class="flow"/><path d="M570 470 H620" class="flow"/><path d="M860 500 H930" class="flow"/><path d="M1095 560 V610" class="flow"/>
  <text x="40" y="710" class="label" fill="#2563eb">Order placement flow</text><text x="40" y="742" class="small">Browser → POST /api/orders → inventory check → pricing/tax/coupon totals → Khata charge (if credit) → reserve stock → append order → store.write(db)</text>
</svg>
